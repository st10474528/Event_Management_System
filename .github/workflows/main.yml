name: RaceDay - Full CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Part 1: Validate planning documents
  part1-validation:
    uses: ./.github/workflows/part1-validation.yml
    secrets: inherit

  # Part 2: Build and test API
  part2-api:
    uses: ./.github/workflows/part2-api.yml
    secrets: inherit
    needs: part1-validation

  # Part 3: Full stack with Docker
  part3-fullstack:
    uses: ./.github/workflows/part3-fullstack.yml    secrets: inherit
    needs: part2-api

  final-status:
    runs-on: ubuntu-latest
    needs: [part1-validation, part2-api, part3-fullstack]
    if: always()
    
    steps:
    - name: Check overall status
      run: |
        echo "🏁 RaceDay CI/CD Pipeline Complete!"
        echo ""
        echo "📊 Pipeline Status:"
        echo "  Part 1 (Planning): ${{ needs.part1-validation.result }}"
        echo "  Part 2 (API): ${{ needs.part2-api.result }}"
        echo "  Part 3 (Full Stack): ${{ needs.part3-fullstack.result }}"
        echo ""
        echo "🟢 All checks complete! Review artifacts for details."
